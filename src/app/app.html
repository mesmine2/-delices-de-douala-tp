<!-- envoie des valeurs du nombre de restaurant, restaurant total, moyenne au header pour qu'il l'affiche -->
<app-header
  [ratedCount]="ratedCount()"
  [totalCount]="totalCount()" 
  [averageRating]="averageRating()"
></app-header>

<div class="toolbar">
  <button
    type="button"
    class="toggle-btn"
    [class.active]="showOnlyHighRated()"
    (click)="toggleHighRatedFilter()"
  >
    ★ Note ≥ 4 uniquement
  </button>

  <button
    type="button"
    class="toggle-btn"
    [class.active]="sortByRatingDesc()"
    (click)="toggleSort()"
  >
    ⇅ Trier par note décroissante
  </button>
</div>

<!-- [restaurant]="displayedRestaurants()" — on passe la liste déjà filtrée et triée (pas le tableau brut restaurants). -->
<app-restaurant-list
  [restaurant]="displayedRestaurants()"
  /* reception du signal de l'enfant */
  (restaurantRated)="onRestaurantRated($event)" 
></app-restaurant-list>
